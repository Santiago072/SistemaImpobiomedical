<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glowPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Fondo redondo premium con gradiente azul médico corporativo -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  
  <!-- Borde fino translúcido de alta tecnología -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Cruz médica de fondo sutil integrada -->
  <path d="M26 12 h12 v12 h12 v12 h-12 v16 h-12 v-16 h-12 v-12 h12 z" fill="#0369a1" opacity="0.4" />

  <!-- Pulso Cardíaco ECG / Electrocardiograma Dinámico Nítido -->
  <polyline 
    points="6,34 16,34 22,34 26,20 32,48 38,14 44,40 48,34 58,34" 
    fill="none" 
    stroke="#ffffff" 
    stroke-width="4.2" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
    filter="url(#shadow)"
  />

  <!-- Onda brillante cian superpuesta -->
  <polyline 
    points="6,34 16,34 22,34 26,20 32,48 38,14 44,40 48,34 58,34" 
    fill="none" 
    stroke="url(#glowPulse)" 
    stroke-width="2.5" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />

  <!-- Punto de pulso activo biomédico -->
  <circle cx="38" cy="14" r="3" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />
  <circle cx="58" cy="34" r="2.2" fill="#22d3ee" />
</svg>
